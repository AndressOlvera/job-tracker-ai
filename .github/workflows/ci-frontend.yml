name: CI frontend

# Sin filtros `paths`: el check `Frontend` es obligatorio para unir a `main`
# y debe correr en todos los PR para no quedarse pendiente (ADR-016, ADR-025).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# En un PR, un push nuevo cancela la ejecución anterior; en `main` se termina cada una.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    # La protección de `main` exige este check por su nombre.
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar con ESLint
        run: npm run lint

      - name: Revisar formato con Prettier
        run: npm run format:check

      - name: Revisar tipos con tsc
        run: npm run typecheck

      - name: Correr pruebas con cobertura (Vitest)
        id: tests
        run: npm test -- --coverage

      - name: Compilar para producción
        run: npm run build

      # Se sube aunque falle el build. Solo si las pruebas pasaron: Vitest no genera
      # el reporte cuando fallan, y si pasaron sin reporte la configuración está rota.
      - name: Guardar la cobertura como artefacto
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: error
